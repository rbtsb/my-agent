services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console

  milvus:
    image: milvusdb/milvus:v2.4.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530" # Milvus SDK port
      - "9091:9091" # Milvus metrics/health
    depends_on:
      - etcd
      - minio

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    # Model is bind-mounted from ./models (downloaded once via `python download_model.py` on the
    # host) rather than downloaded by the container itself — the container's egress goes through
    # the Docker Desktop proxy, which breaks on a redirect partway through HF's download. This
    # also means the running service makes zero outbound calls, which fits the on-prem story better.
    command: ["--model-id", "/data/multilingual-e5-small"]
    volumes:
      - ./models:/data:ro
    ports:
      - "8080:80" # embedding HTTP API

  attu:
    image: zilliz/attu:v2.4.4
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000" # Attu web UI
    depends_on:
      - milvus

  web:
    build: .
    env_file: .env # OPENROUTER_API_KEY, CRM_DB_* — see .env
    environment:
      MILVUS_URI: http://milvus:19530
      TEI_URL: http://embeddings:80/embed
      CRM_DB_HOST: host.docker.internal # crm-postgres runs as its own separate container, reached via the host
      # budget-management-system's own docker-compose stack runs separately and is reached via the
      # host too — BUDGET_API_KEY/BUDGET_PERSON_ID still come from .env (env_file above).
      BUDGET_API_BASE_URL: http://host.docker.internal:8090
    volumes:
      - .:/app # bind mount, not baked into the image — edits on the host apply without a rebuild, and tasks.json persists
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway" # no-op on Docker Desktop, needed on Linux
    depends_on:
      - milvus
      - embeddings

volumes:
  etcd_data:
  minio_data:
  milvus_data:
